name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test

      # GITHUB_PAGES là thứ bật basePath `/web-game-gomoku`. Không dùng NODE_ENV,
      # vì `next build` chạy ở máy nào cũng là production và khi đó `out/index.html`
      # mở bằng file:// sẽ hỏng hết đường dẫn asset.
      - run: yarn build
        env:
          GITHUB_PAGES: 'true'

      # `enablement: true` để chính workflow bật Pages qua API nếu repo chưa bật,
      # thay vì bắt người ta vào Settings bấm tay. Đổi lại: workflow này SỬA THIẾT
      # LẬP của repo, không chỉ đọc. Xem ADR-0011.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          # Next.js static export ra `out`, không phải `dist`.
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
